version: '3.8'

services:
  # 1. FastAPI Microservice Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celonis_translation_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - redis
      - qdrant
      - minio
    restart: always

  # 2. Next.js 14 Frontend Web Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: celonis_translation_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

  # 3. Redis Task Queue Broker (Celery Async Worker Queue - 100% Free)
  redis:
    image: redis:7-alpine
    container_name: celonis_redis_broker
    ports:
      - "6379:6379"
    restart: always

  # 4. Qdrant Vector Database Cluster (HNSW Vector RAG - 100% Free)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: celonis_qdrant_vectordb
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  # 5. MinIO S3 Object Storage Server (AWS S3 Replacement - 100% Free)
  minio:
    image: minio/minio:latest
    container_name: celonis_minio_s3
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_storage:/data
    restart: always

volumes:
  qdrant_storage:
  minio_storage:
